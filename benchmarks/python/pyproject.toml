[project]
name = "regionprops-bench"
version = "0.1.0"
description = "scikit-image side of the IceFloeTracker regionprops benchmark"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scikit-image>=0.24",
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "nbconvert>=7.17.1",
]

[tool.pytest.ini_options]
addopts = "-q"
